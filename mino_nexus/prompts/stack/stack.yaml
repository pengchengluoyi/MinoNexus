version: 1
drivers:
- id: adb
  label: 真机 ADB
  kind: device
  summary: 本机点按、截图、装包
- id: claw
  label: Scout 远程
  kind: device
  summary: 经 Scout 执行
- id: im.send
  label: IM 发消息
  kind: channel
  summary: 通道回消息
- id: figma.sync
  label: Figma 拉稿
  kind: plugin
  summary: 按应用拉设计稿
skill_categories:
- id: flow
  label: 流程产出
  desc: 读需求、写脑图和用例
- id: device
  label: 设备操作
  desc: 真机上规划、点按、定位和断言
- id: channel
  label: 通道对话
  desc: IM 里回答、下令
- id: sync
  label: 外部同步
  desc: 设计稿 / 文档
skills:
- id: run-case
  label: 执行测试用例
  owner: test-engineer
  summary: 看图按前置 / 操作 / 预期推进，调用能力目录里的 function。
  intent: act
  category: device
- id: explore-app
  label: 应用探索
  owner: test-engineer
  summary: 在 App 内自由探索，被动采集拓展 Screen Atlas。
  intent: act
  category: device
- id: analyze_req
  label: 拆验收标准
  owner: req-analyst
  summary: 读需求原文，拆测试点和验收。
  intent: persist
  category: flow
- id: draft_mindmap
  label: 写测试脑图
  owner: mindmap-writer
  summary: 按入口和端铺覆盖脑图。
  intent: persist
  category: flow
- id: draft_cases
  label: 写用例草稿
  owner: case-writer
  summary: 按测试点展开步骤和预期。
  intent: persist
  category: flow
- id: propose_atlas
  label: 建议图谱变更
  owner: req-analyst
  summary: 判断需求影响哪些模块，只出品变更。
  intent: persist
  category: flow
- id: conductor
  label: 分析师调度
  owner: conductor
  summary: 看当前步骤该调用哪个角色。默认走剧本。
  intent: talk
  category: flow
- id: im-dialogue
  label: IM 对话
  owner: im-qa-assistant
  summary: 通道里回答测试同学并建议下一步。
  intent: talk
  category: channel
- id: im-defect
  label: IM 提缺陷
  owner: im-defect-assistant
  summary: 把说清的缺陷整理成 JSON。
  intent: talk
  category: channel
- id: req-qa-bm
  label: 需求验收
  owner: req-qa-bm
  summary: 一条需求从覆盖到验收，结论必须人审。
  intent: talk
  category: flow
- id: version-qa-bm
  label: 版本发版评审
  owner: version-qa-bm
  summary: 这版带哪些需求出门、历史回归。
  intent: talk
  category: flow
- id: test-engineer-chat
  label: 测试工程师（对话）
  owner: test-engineer
  summary: 身份说明。真机执行走「执行测试用例」。
  intent: talk
  category: device
- id: report-writer
  label: 写测试报告
  owner: report-writer
  summary: 按流程事实写报告草稿。
  intent: talk
  category: flow
- id: doc-keeper
  label: 同步外部文档
  owner: doc-keeper
  summary: 把人确认过的内容同步到 Wiki。
  intent: talk
  category: sync
- id: knowledge-reviewer
  label: 审核知识草稿
  owner: knowledge-reviewer
  summary: 审执行沉淀的知识能否注入后续匹配。
  intent: talk
  category: flow
- id: product-expert
  label: 应用简报
  owner: product-expert
  summary: 提供被测应用的图谱与功能事实。
  intent: talk
  category: flow
- id: map_cases
  label: 对照用例库
  owner: req-qa-bm
  summary: 看覆盖够不够
  intent: persist
  category: flow
- id: draft_sign
  label: 验收草稿
  owner: req-qa-bm
  summary: 出建议，结论人点
  intent: persist
  category: flow
- id: pick_regression
  label: 圈回归范围
  owner: version-qa-bm
  summary: 圈本版回归用例
  intent: persist
  category: flow
- id: draft_gate
  label: 发版草稿
  owner: version-qa-bm
  summary: 出建议，结论人点
  intent: persist
  category: flow
- id: assert-vision
  label: 视觉断言
  owner: test-engineer
  summary: 检查点是否达成
  intent: act
  category: device
roles:
- id: conductor
  label: 分析师
- id: req-analyst
  label: 需求分析师
- id: mindmap-writer
  label: 脑图编写
- id: case-writer
  label: 用例编写
- id: req-qa-bm
  label: 需求测试 BM
- id: version-qa-bm
  label: 版本测试 BM
- id: test-engineer
  label: 测试工程师
- id: report-writer
  label: 报告编写
- id: doc-keeper
  label: 文档维护
- id: im-qa-assistant
  label: IM 总指挥
- id: im-defect-assistant
  label: IM 缺陷助手
- id: knowledge-reviewer
  label: 知识审核员
- id: product-expert
  label: 产品专家
triggers:
- id: im_chat
  label: IM 进线
  summary: 通道里有人私聊或 @机器人
  intents:
  - dialogue
  - defect
  live: false
- id: qa_tick
  label: 继续分析
  summary: 需求 / 版本流程点「继续分析」
  intents:
  - default
  live: true
- id: case_run
  label: 跑用例
  summary: 对应用和设备下发自动化
  intents:
  - default
  live: true
- id: settings_chat
  label: 设置页对话
  summary: 角色页里的试对话
  intents:
  - default
  live: true
skill_drivers:
  im-dialogue:
  - im.send
  run-case:
  - adb
  - claw
  assert-vision:
  - adb
  - claw
role_skills:
  im-qa-assistant:
  - im-dialogue
  im-defect-assistant:
  - im-defect
  req-analyst:
  - analyze_req
  - propose_atlas
  mindmap-writer:
  - draft_mindmap
  case-writer:
  - draft_cases
  req-qa-bm:
  - map_cases
  - draft_sign
  version-qa-bm:
  - pick_regression
  - draft_gate
  test-engineer:
  - run-case
  - assert-vision
  conductor: []
trigger_roles:
  im_chat:
    dialogue: im-qa-assistant
    defect: im-defect-assistant
  qa_tick:
    default: conductor
  case_run:
    default: test-engineer
  settings_chat:
    default: ''
trigger_skills:
  im_chat:
    dialogue: im-dialogue
    defect: im-defect
  qa_tick:
    default: ''
  case_run:
    default: run-case
  app_explore:
    default: explore-app
  explore_run:
    default: explore-app
  settings_chat:
    default: ''
intent_labels:
  dialogue: 问答
  defect: 提缺陷
  default: 默认
skill_aliases:
  im.dialogue: im-dialogue
  im.defect: im-defect
  agent-decide: run-case
  plan-overview: run-case
bindings: {}
