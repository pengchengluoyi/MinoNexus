id: explore-app
version: 1
label: 应用探索
summary: 在 App 内自由探索，被动采集拓展 Screen Atlas。
category: device
role: test-engineer
role_label: 测试工程师
engine: agent_loop
sop:
  phases:
  - id: do
    job: agent-decide
    tool_kinds:
    - generic
    - recovery
    guards:
    - action_fuse
    - limit_recovery_retry
    - block_login_after_guest
    advance_on: signal_done
  inspections: []
  pointer: none
  tool_kinds:
  - generic
  - recovery
  max_steps: 80
  max_idle_steps: 15
input:
  type: instruction
  map:
    goal: case.steps_raw
    success: case.success_criteria
view:
  id: job-timeline
triggers:
- app_explore
- explore_run
enabled: true
sort_order: 11
