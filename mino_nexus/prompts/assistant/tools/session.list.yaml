id: session.list
title: 任务会话列表
description: 按 run_id 查询跑批任务对应的会话。先从这里获得完整 session_id，再用 session_llm_list 查模型调用、session_events 查工具与守卫事件。不会执行或重跑用例。
route: GET /case-runner/sessions
risk: read
async: false
params_schema:
  type: object
  properties:
    run_id:
      type: string
      description: 跑批任务 ID，例如 cr-c8a13f5e7b41。
    case_id:
      type: string
    status:
      type: string
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 30
    offset:
      type: integer
      minimum: 0
      default: 0
  required:
  - run_id
param_resolvers: {}
result_pick:
- data
surfaces:
- mcp
enabled: true
