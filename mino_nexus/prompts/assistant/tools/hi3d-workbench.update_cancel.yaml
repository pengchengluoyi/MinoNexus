{
  "id": "workbench.update_cancel",
  "version": 1,
  "title": "取消未执行 Workbench 更新",
  "description": "仅取消仍处于 requested 的原操作；安装开始后拒绝，不杀进程，不释放其他操作的锁。",
  "route": "POST /sys/workbench/updates/cancel",
  "risk": "write",
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "installation_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      },
      "operation_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    "required": [
      "installation_id",
      "operation_id"
    ]
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "card": "answer",
  "surfaces": [
    "mcp"
  ],
  "enabled": true,
  "async": false
}
