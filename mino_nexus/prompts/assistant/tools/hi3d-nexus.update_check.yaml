{
  "id": "nexus.update_check",
  "version": 1,
  "title": "从安装配置的 GitHub 仓库检查最新稳定版或指定固定 tag；只读，不下载、不升级。返回的 release_tag/build_id 用于后续 prepare。",
  "description": "从安装配置的 GitHub 仓库检查最新稳定版或指定固定 tag；只读，不下载、不升级。返回的 release_tag/build_id 用于后续 prepare。",
  "route": "GET /sys/updates/check",
  "risk": "read",
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "release_tag": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    "required": []
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "card": "answer",
  "surfaces": [
    "mcp"
  ],
  "enabled": true,
  "async": false
}
