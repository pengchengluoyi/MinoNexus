id: case.run
version: 5
title: 跑用例
description: 在指定设备上执行用例，返回任务 id。用户说跑一下、执行、回归时用。
route: POST /case-runner/run
risk: write
async: true
params_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 用户明确指定的项目 id 或名称，用于限定应用和渠道
    app_id:
      type: string
      description: 应用 id 或应用名
    env_surface:
      type: string
      description: 用户明确指定的应用渠道 id 或别名，例如 Agent/macagent；先确定渠道再筛选设备
    env_profile:
      type: string
      description: 本次运行环境，例如 test/pre/prod
    sn:
      type: string
      description: 设备序列号或别名
    modules:
      type: array
      items:
        type: string
      description: 用户明确要求多个模块时的并集，去重执行项目共享用例
    module:
      type: string
      description: 用户指定的用例模块，按项目共享用例范围精确筛选
    search:
      type: string
      description: 用户指定的用例名称关键字
    ordinal:
      type: integer
      minimum: 1
      description: 当前范围内第几条用例，第一条传 1
    all_cases:
      type: boolean
      description: 仅用户明确要求整个项目全部用例时传 true
    playwright_headless:
      type: boolean
      description: 无头浏览器模式，影响资源容量与准入
    case_ids:
      type: array
      items:
        type: string
      description: 明确选择的用例 id，空列表不会执行全部
    action_scheme:
      type: string
      enum:
      - dom_preferred
      - visual
      - dom
      default: dom_preferred
      description: 执行策略；默认 dom_preferred，有有效结构用 DOM，无法定位时用截图兜底；visual 为纯视觉，旧 dom 兼容映射到 dom_preferred。平台执行能力由设备与渠道准入判断。
  required:
  - app_id
param_resolvers:
  project_id: project.by_name
  app_id: app.by_name
  env_surface: channel.by_name
  sn: device.by_alias
result_pick:
- data.task_id
- data.run_id
- data.id
card: case_run_started
surfaces:
- im
- mcp
enabled: true
followup_card: case_run_finished
