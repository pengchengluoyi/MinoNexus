{
  "id": "development.prepare",
  "version": 1,
  "title": "准备应用测试环境",
  "description": "准备应用测试环境。仅通过正式 Nexus 调用已授权 Scout；不等同用例运行。",
  "route": "POST /project/app/{app_id}/development/operations",
  "risk": "write",
  "async": false,
  "params_schema": {
    "type": "object",
    "properties": {
      "app_id": {
        "type": "string"
      },
      "operation_id": {
        "type": "string",
        "description": "稳定操作 ID；重试必须使用相同 ID，unknown 不重新启动"
      },
      "revision": {
        "type": "integer",
        "minimum": 1
      },
      "action": {
        "type": "string",
        "enum": [
          "check",
          "execute",
          "restart",
          "build",
          "probe",
          "install",
          "logs"
        ]
      }
    },
    "required": [
      "app_id",
      "operation_id",
      "revision",
      "action"
    ]
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "surfaces": [
    "mcp"
  ],
  "enabled": true
}
