{
  "id": "nexus.update_prepare",
  "version": 1,
  "title": "下载并校验检查结果中的固定 GitHub release_tag/build_id，保留原安装；下载成功不等于兼容性通过，也不会自动执行升级。",
  "description": "下载并校验检查结果中的固定 GitHub release_tag/build_id，保留原安装；下载成功不等于兼容性通过，也不会自动执行升级。",
  "route": "POST /sys/updates/prepare",
  "risk": "write",
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "release_tag": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      },
      "build_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    "required": [
      "release_tag",
      "build_id"
    ]
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "card": "answer",
  "surfaces": [
    "mcp"
  ],
  "enabled": true,
  "async": false
}
