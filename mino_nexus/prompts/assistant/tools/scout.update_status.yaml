id: scout.update_status
version: 2
title: 查询 Scout 更新操作
description: 查询原 operation_id 的最后确认状态、持久门禁和运行版本核验。离线或断线不等于失败，不自动重发安装。
route: GET /runtime/nodes/{node_id}/update-status
risk: read
params_schema:
  type: object
  additionalProperties: false
  properties:
    node_id: {type: string, minLength: 1, pattern: '^[a-z0-9]+$'}
    operation_id: {type: string, pattern: '^[A-Za-z0-9_-]{8,100}$'}
  required: [node_id]
param_resolvers: {}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
async: false
