id: session.llm.list
version: 1
title: 会话模型调用列表
description: 按会话和可选 turn 分页查询 LLM 调用，返回事件 seq、dispatch_id、job、model、error 及原始响应可用性。用 dispatch_id 调 llm_get 获取正文；has_more=true 时以 next_from_seq 继续。
route: GET /case-runner/sessions/{session_id}/llm-calls
risk: read
async: false
params_schema:
  type: object
  properties:
    session_id:
      type: string
    turn:
      type: integer
      minimum: 0
      description: 可选，只查询指定决策回合。
    from_seq:
      type: integer
      minimum: 0
      default: 0
    limit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
  required:
  - session_id
param_resolvers: {}
result_pick:
- data
surfaces:
- mcp
enabled: true
