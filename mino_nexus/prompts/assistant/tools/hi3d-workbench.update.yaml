{
  "id": "workbench.update",
  "version": 1,
  "title": "更新或回退 Workbench 固定版本",
  "description": "仅部署管理员可用。只更新已登记的同机安装，目标包须本地暂存且有已实测 Nexus build 组合。rollback=true 回退保留版本。稳定 operation_id 幂等，断线先查原操作，不更换 ID 重试。不提供 dirty 包绕过。",
  "route": "POST /sys/workbench/updates/request",
  "risk": "write",
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "installation_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      },
      "operation_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      },
      "build_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      },
      "rollback": {
        "type": "boolean",
        "default": false
      }
    },
    "required": [
      "installation_id",
      "operation_id",
      "build_id"
    ]
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "card": "answer",
  "surfaces": [
    "mcp"
  ],
  "enabled": true,
  "async": false
}
