id: collab.topic_from_case
title: 打开用例协作议题
description: 为某条用例打开或复用协作议题，便于讨论与安排执行。用户要在群里跟进某用例时用。
route: POST /project/{project_id}/collab/topics/from-case
risk: write
async: false
params_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 项目 id 或项目名
    app_id:
      type: string
      description: 应用 id 或应用名
    case_id:
      type: string
      description: 用例编号
  required:
  - project_id
  - app_id
  - case_id
param_resolvers:
  project_id: project.by_name
  app_id: app.by_name
result_pick:
- data.topic.topic_id
- data.topic.title
- data.created
card: answer
surfaces:
- im
- mcp
enabled: false
