id: member.assign
version: 1
title: 指派群成员
description: 按顺序指派本群成员的 chat_jobs；覆盖分析使用 map_cases，只有规则结果可以作为数字依据。target 只能给出目标 id，不能提供业务数据。成员不在群中时先请用户拉入。
workspace_only: true
risk: read
enabled: true
params_schema:
  type: object
  additionalProperties: false
  properties:
    member: {type: string}
    job: {type: string}
    question: {type: string}
    target:
      type: object
      additionalProperties: false
      properties:
        requirement_id: {type: string}
        release_id: {type: string}
        run_id: {type: string}
  required: [member, job]
