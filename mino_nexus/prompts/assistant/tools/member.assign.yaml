id: member.assign
title: 指派群成员
description: 按顺序指派本群成员的 chat_jobs。仅在用户要求分析测试点覆盖或覆盖缺口时使用 map_cases；查询已有或刚导入的用例应直接使用 case.list，不依赖测试点。数字以业务工具或规则结果为准。target 只能给出目标 id，不能提供业务数据。成员不在群中时先请用户拉入。
workspace_only: true
risk: read
enabled: true
params_schema:
  type: object
  additionalProperties: false
  properties:
    member: {type: string}
    job: {type: string}
    question: {type: string}
    target:
      type: object
      additionalProperties: false
      properties:
        requirement_id: {type: string}
        release_id: {type: string}
        run_id: {type: string}
  required: [member, job]
