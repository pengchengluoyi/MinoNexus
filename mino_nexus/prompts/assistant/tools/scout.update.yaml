id: scout.update
version: 2
title: 更新指定 Scout 版本
description: 请求固定 release_tag 与 build_id 的节点更新。返回持久 operation_id，默认等待空闲最多30分钟；不打断已有批次。断线后查询原操作，不能换 ID 重试。rollback 必须指定原成功操作 rollback_of。不接受下载 URL。
route: POST /runtime/nodes/{node_id}/update
risk: write
params_schema:
  type: object
  additionalProperties: false
  properties:
    node_id: {type: string, minLength: 1, pattern: '^[a-z0-9]+$'}
    operation_id: {type: string, pattern: '^[A-Za-z0-9_-]{8,100}$'}
    release_tag: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$'}
    build_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$'}
    action: {type: string, enum: [update, rollback], default: update}
    rollback_of: {type: string, maxLength: 100}
    wait_seconds: {type: integer, minimum: 1, maximum: 1800, default: 1800}
    reason: {type: string, maxLength: 500}
  required: [node_id, operation_id, release_tag, build_id]
param_resolvers: {}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
async: false
