id: resource.account.list
title: 测试账号列表
description: 列出一个项目的测试账号，支持按环境、占用状态、生命周期、关键词筛选。state=occupied 包含被 run 或 MCP 预约占用的账号；过期但未释放的租约仍算 occupied。返回账号、密码、OTP、手机号/邮箱明文，以及租约和占用状态。用户问“还有哪些号可用/谁占着这个号”时用。
route: GET /project/{project_id}/resources/accounts
risk: read
async: false
version: 1
params_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 项目 id 或项目名
    env:
      type: string
      description: 环境 key，例如 test/pre/prod
    state:
      type: string
      enum:
      - free
      - occupied
      - locked
      description: free 空闲；occupied 被租约/MCP 预约占用；locked 手动锁定
    lifecycle:
      type: string
      enum:
      - unregistered
      - registered
      - unknown
      description: 注册生命周期 facet；注册完成后用它查未注册/已注册
    q:
      type: string
      description: 按账号标识、显示名、备注模糊搜索；服务端按明文匹配
    limit:
      type: integer
      default: 50
      minimum: 1
      maximum: 200
    offset:
      type: integer
      default: 0
      minimum: 0
  required:
  - project_id
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
