{
  "id": "workbench.update_status",
  "version": 1,
  "title": "查询 Workbench 更新状态",
  "description": "读取安装端原 operation_id 的持久状态，不重装或重启；安装端记录是权威，断线不等于失败。",
  "route": "GET /sys/workbench/updates/status",
  "risk": "read",
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "installation_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      },
      "operation_id": {
        "type": "string",
        "minLength": 1,
        "maxLength": 101,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      }
    },
    "required": [
      "installation_id",
      "operation_id"
    ]
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "card": "answer",
  "surfaces": [
    "mcp"
  ],
  "enabled": true,
  "async": false
}
