{
  "id": "collab.automation_update",
  "version": 1,
  "title": "按用户明确要求保存完整自动化配置；先读取最新配置和 revision，保留其他字段",
  "description": "按用户明确要求保存完整自动化配置；先读取最新配置和 revision，保留其他字段",
  "route": "PUT /project/{project_id}/collab/workspaces/{topic_id}/automation",
  "risk": "write",
  "enabled": true,
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "project_id": {
        "type": "string"
      },
      "topic_id": {
        "type": "string"
      },
      "config": {
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "default": false,
            "title": "Enabled",
            "type": "boolean"
          },
          "analyze_finished": {
            "default": false,
            "title": "Analyze Finished",
            "type": "boolean"
          },
          "report_finished": {
            "default": false,
            "title": "Report Finished",
            "type": "boolean"
          },
          "interval_minutes": {
            "default": 0,
            "maximum": 525600,
            "minimum": 0,
            "title": "Interval Minutes",
            "type": "integer"
          },
          "watch_manual_failures": {
            "default": false,
            "title": "Watch Manual Failures",
            "type": "boolean"
          },
          "resource_ready": {
            "default": false,
            "title": "Resource Ready",
            "type": "boolean"
          },
          "scope_changed": {
            "default": false,
            "title": "Scope Changed",
            "type": "boolean"
          },
          "cases_changed": {
            "default": false,
            "title": "Cases Changed",
            "type": "boolean"
          },
          "compilation_ready": {
            "default": false,
            "title": "Compilation Ready",
            "type": "boolean"
          },
          "retry_failed": {
            "default": 0,
            "maximum": 3,
            "minimum": 0,
            "title": "Retry Failed",
            "type": "integer"
          },
          "device_sn": {
            "default": "",
            "maxLength": 200,
            "title": "Device Sn",
            "type": "string"
          },
          "notification_subscription_id": {
            "default": 0,
            "minimum": 0,
            "title": "Notification Subscription Id",
            "type": "integer"
          }
        },
        "type": "object"
      },
      "revision": {
        "type": "integer",
        "minimum": 0
      }
    },
    "required": [
      "project_id",
      "topic_id",
      "config",
      "revision"
    ]
  },
  "result_pick": [
    "data"
  ],
  "card": "answer"
}
