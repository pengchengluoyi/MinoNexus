id: work.create
title: 创建可接管的工作项
description: 用户提出多步任务、需要计划/审批/验收时，创建 work_item；单步查询和直接 case.run 不需要它。
route: POST /project/{project_id}/work
risk: write
async: false
params_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 当前工作区所属项目 id
    goal:
      type: string
      maxLength: 4000
      description: 用户要完成的目标，保留原意和范围
    title:
      type: string
      maxLength: 200
      description: 时间线显示标题，可省略
    topic_id:
      type: string
      description: 当前工作区 topic id，有则传
    acceptance:
      type: array
      items:
        type: string
      description: 用户明确给出的验收标准；没有则不传，由计划生成
    instructions:
      type: array
      items:
        type: string
      description: 用户补充的约束，例如不要跑全量、必须用某台设备
    policy:
      type: object
      description: 执行策略；默认 plan（计划批准后写工具按计划执行）
      properties:
        write_approval:
          type: string
          enum:
          - plan
          - always
          description: plan=计划级审批；always=每次写工具执行前都单独审批
  required:
  - project_id
  - goal
card: work
surfaces:
- im
- mcp
enabled: true
