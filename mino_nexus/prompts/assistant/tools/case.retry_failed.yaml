id: case.retry_failed
version: 2
title: 重跑失败项
description: 复跑已验证尚未发生写入的失败执行单元，保持原设备、快照及剩余预算。省略执行单元时由服务读取合格项；无合格项则停止。
route: POST /case-runner/tasks/{task_id}/retry-failed
risk: write
async: true
params_schema:
  type: object
  properties:
    task_id:
      type: string
    execution_unit_ids:
      type: array
      items:
        type: string
      description: 原运行中具备安全重试证据的执行单元 ID；省略时选择当前合格项。
  required:
  - task_id
result_pick:
- data.task_id
- data.run_id
card: case_run_started
surfaces:
- im
- mcp
enabled: true
followup_card: case_run_finished
