{
  "id": "development.connection",
  "version": 1,
  "title": "管理开发节点 IDE 连接",
  "description": "在当前账号所属 Scout 列出或保存独立 IDE 连接，action 为 list_connections 或 save_connection。保存使用 connection_revision 乐观锁；不接收明文认证 header。返回持久操作，必须通过 development.operation 查询最终回执；queued 不等于成功。正式 Scout 经 IDE 准备测试项目，Nexus 不直连设备或 IDE。",
  "route": "POST /project/app/{app_id}/development/connections",
  "risk": "write",
  "async": false,
  "params_schema": {
    "additionalProperties": false,
    "properties": {
      "operation_id": {
        "pattern": "^[a-zA-Z0-9_-]{8,100}$",
        "title": "Operation Id",
        "type": "string",
        "description": "稳定操作 ID；同一次请求沿用原 ID，状态 unknown 时查询原操作，不重新派发。"
      },
      "node_id": {
        "title": "Node Id",
        "type": "string"
      },
      "action": {
        "enum": [
          "save_connection",
          "list_connections"
        ],
        "title": "Action",
        "type": "string"
      },
      "connection_id": {
        "default": "",
        "title": "Connection Id",
        "type": "string",
        "description": "同一 Scout 内的独立连接名称；保存后以回执中的 ID 与 revision 建立应用绑定。"
      },
      "connection_revision": {
        "default": 0,
        "minimum": 0,
        "title": "Connection Revision",
        "type": "integer"
      },
      "connection": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "url": {
            "type": "string",
            "description": "Scout 本机 PyCharm MCP 的回环 HTTP/S URL；不是 Nexus MCP 地址。"
          },
          "transport": {
            "type": "string",
            "enum": [
              "http",
              "streamable-http",
              "sse"
            ]
          },
          "type": {
            "type": "string",
            "enum": [
              "http",
              "streamable-http",
              "sse"
            ]
          },
          "headers": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            },
            "description": "仅非秘密 x-idea-project；认证值不能放在这里。"
          },
          "header_env": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "pattern": "^MINO_IDE_[A-Z0-9_]{1,100}$"
            },
            "description": "Authorization/X-API-Key 仅引用 Scout 本机环境变量名，不接收密钥明文。"
          }
        }
      },
      "app_id": {
        "type": "string",
        "minLength": 1,
        "description": "有写权限的应用 ID"
      }
    },
    "required": [
      "app_id",
      "operation_id",
      "node_id",
      "action"
    ],
    "type": "object"
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "surfaces": [
    "mcp"
  ],
  "enabled": true
}
