id: task.list
version: 1
title: 最近任务
description: 列出最近的跑批任务。用户问最近跑得怎么样、有没有失败时用。
route: GET /case-runner/tasks
risk: read
async: false
params_schema:
  type: object
  properties:
    app_id:
      type: string
      description: 应用 id 或应用名
    status:
      type: string
    limit:
      type: integer
param_resolvers:
  app_id: app.by_name
result_pick:
- data
card: answer
surfaces:
- im
- mcp
enabled: true
