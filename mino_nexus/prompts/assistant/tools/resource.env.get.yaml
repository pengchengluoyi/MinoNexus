id: resource.env.get
title: 项目环境（脱敏）
description: 读取项目环境：环境 key/标签、渠道、profiles 的字段是否已配置，以及 secret 槽位名。只返回槽位名和是否配置，不返回渠道 token、密码、cookie、Gmail 凭据。用户问“项目配了哪些环境/哪个渠道没配”时用。
route: GET /project/{project_id}/resources/env
risk: read
async: false
version: 1
params_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 项目 id 或项目名
  required:
  - project_id
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
