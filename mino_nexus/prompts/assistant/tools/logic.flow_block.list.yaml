id: logic.flow_block.list
title: 流程块目录
description: 列出可复用的流程块目录（只返回块定义、步骤数和用例引用，不返回步骤正文）。用户问“有哪些流程块/有没有登录流程块”时用。目录是全局配置，project_id 只用于校验访问权限。
route: GET /project/{project_id}/logic/flow-blocks
risk: read
async: false
version: 1
params_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 项目 id 或项目名（只用于校验访问权限）
    channel:
      type: string
      description: 可选，web/android/ios；留空返回全部
  required:
  - project_id
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
