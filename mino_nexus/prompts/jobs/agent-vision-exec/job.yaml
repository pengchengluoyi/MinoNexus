id: agent-vision-exec
version: 17
label: 看图执行
summary: 按 plan_digest 输出单步 capability；里程碑由 agent-vision-plan 维护
engine: vision_decide
role: test-engineer
output_schema: agent_decision
enabled: true
sort_order: 10
flags: []
slots:
- name: image_base64
  kind: image
- name: image_mime
  kind: text
- name: active_milestone
  kind: text
- name: case_execution_context_json
  kind: text
- name: correction_hint
  kind: text
- name: doc_context
  kind: text
- name: goal
  kind: text
- name: hierarchy_text
  kind: text
- name: knowledge_body
  kind: text
- name: knowledge_hint
  kind: text
- name: menu_json
  kind: text
- name: nav_assist
  kind: text
- name: phase
  kind: text
- name: plan_digest
  kind: text
- name: screen_size_block
  kind: text
- name: session_json
  kind: text
- name: success_criteria
  kind: text
- name: target_app
  kind: text
- name: task_context_json
  kind: text
call:
  temperature: 0.1
  max_tokens: 768
  timeout_sec: 90
  json_mode: false
  require_tool_calls: true
image:
  slot: image_base64
  position: after_text
  required: true
system:
- id: main
  file: system/10-main.md
user:
- id: task
  slot: task_context_json
