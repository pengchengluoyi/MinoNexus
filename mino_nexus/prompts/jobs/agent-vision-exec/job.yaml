- id: case
  slot: case_execution_context_json
  heading: ==== case_execution ====
- id: plan
  slot: plan_digest
  heading: ==== plan_digest ====
- id: am
  slot: active_milestone
  heading: ==== active_milestone ====
- id: sc
  slot: success_criteria
  heading: ==== success_criteria ====
- id: correction
  slot: correction_hint
  heading: ==== correction_hint ====
  skip_if_empty: true
- id: goal
  slot: goal
  heading: ==== goal ====
- id: sess
  slot: session_json
  heading: ==== session ====
- id: nav
  slot: nav_assist
  heading: ==== nav ====
  skip_if_empty: true
- id: know
  slot: knowledge_body
  heading: ==== knowledge ====
  skip_if_empty: true
- id: doc
  slot: doc_context
  heading: ==== doc ====
  skip_if_empty: true
- id: hier
  slot: hierarchy_text
  heading: ==== hierarchy ====
  skip_if_empty: true
- id: img
