- name: doc_context
  kind: text
- name: hierarchy_text
  kind: text
- name: knowledge_body
  kind: text
- name: knowledge_hint
  kind: text
- name: nav_assist
  kind: text
- name: phase
  kind: text
- name: phase_step_text
  kind: text
- name: prep_program_plan
  kind: text
- name: review_program_fail
  kind: text
- name: screen_size_block
  kind: text
- name: session_json
  kind: text
- name: success_criteria
  kind: text
- name: target_app
  kind: text
- name: task_context_json
  kind: text
- name: resource_claim_json
