name: Release native production
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: windows-latest
            platform: win32-x64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller
      - name: Validate source version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; assert os.environ['GITHUB_REF_NAME'] == 'v' + __import__('pathlib').Path('mino_nexus/VERSION').read_text().strip()"
      - name: Validate repository installer
        run: |
          bash -n packaging/bootstrap.sh
          bash -n packaging/install.sh
      - run: python scripts/build_release.py --output dist
      - name: Create install manifest for the exact build
        run: |
          VERSION=$(python -c "from pathlib import Path; import json; print(Path('mino_nexus/VERSION').read_text().strip() if Path('mino_nexus').is_dir() else json.loads(Path('package.json').read_text())['version'])")
          python scripts/write_manifest.py --dist dist --prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION"
      - name: Install released upgrade baseline and create persistent user data
        run: |
          python packaging/install.py --components nexus --nexus-version 0.1.43 --root "$RUNNER_TEMP/mino-install/nexus" --command-dir "$RUNNER_TEMP/mino-commands" --no-path --no-open
          python - <<'PYCODE'
          import json, os, pathlib, urllib.request, uuid
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-install/nexus'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          email = 'upgrade-'+uuid.uuid4().hex+'@example.com'
          password = uuid.uuid4().hex
          request = urllib.request.Request('http://127.0.0.1:50104/auth/register', data=json.dumps({'email':email,'password':password,'name':'Upgrade acceptance'}).encode(), headers={'Content-Type':'application/json','X-Mino-Client':'workbench'})
          with opener.open(request) as response: assert json.load(response)['ok']
          (root/'data/upgrade-preservation.txt').write_text('retained user file')
          evidence = {'email':email,'password':password,'config':json.loads((root/'config/mino-deployment.json').read_text())}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'upgrade-before.json').write_text(json.dumps(evidence))
          PYCODE
      - name: Validate installer against the actual native package
        run: |
          python - <<'PYCODE'
          import os, pathlib, subprocess
          installer = next(p for p in pathlib.Path('dist').glob('MinoInstaller-*') if p.is_file())
          subprocess.run([str(installer.resolve()), '--components', 'nexus', '--package-dir', str(pathlib.Path('dist').resolve()), '--root', str(pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-install'/'nexus'), '--command-dir', str(pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-commands'), '--no-path'], check=True)
          PYCODE
      - name: Verify upgraded identity, user login and retained backups
        run: |
          python - <<'PYCODE'
          import json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-install/nexus'
          before = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'upgrade-before.json').read_text())
          assert json.loads((root/'config/mino-deployment.json').read_text()) == before['config']
          assert (root/'data/upgrade-preservation.txt').read_text() == 'retained user file'
          state = json.loads((root/'updates/mino-state.json').read_text())
          assert state['state'] == 'succeeded' and state['previous_build'].startswith('0.1.43-')
          assert pathlib.Path(state['backup']).joinpath('mino.db').is_file()
          assert pathlib.Path(state['launcher_backup']).is_dir()
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          request = urllib.request.Request('http://127.0.0.1:50104/auth/login', data=json.dumps({'email':before['email'],'password':before['password']}).encode(), headers={'Content-Type':'application/json','X-Mino-Client':'workbench'})
          with opener.open(request) as response: assert json.load(response)['ok']
          PYCODE
      - name: Verify Windows shared locks and concurrent native health
        if: runner.os == 'Windows'
        run: |
          python - <<'PYCODE'
          import concurrent.futures, os, pathlib, subprocess, sys, urllib.request
          from mino_nexus.core.platform_runtime import file_lock
          from mino_nexus.core.deployment import Deployment
          from mino_nexus.core.update_engine import health_probe
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-install/nexus'
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'native-shared-lock'
          shared = "from pathlib import Path; from mino_nexus.core.platform_runtime import file_lock; import sys\nwith file_lock(Path(sys.argv[1]), shared=True, blocking=False): print('shared acquired')"
          exclusive = "from pathlib import Path; from mino_nexus.core.platform_runtime import file_lock; import sys\ntry:\n with file_lock(Path(sys.argv[1]), blocking=False): pass\nexcept BlockingIOError: sys.exit(0)\nsys.exit(1)"
          with file_lock(path, shared=True):
              subprocess.run([sys.executable,'-c',shared,str(path)],check=True,timeout=15)
              subprocess.run([sys.executable,'-c',exclusive,str(path)],check=True,timeout=15)
          with file_lock(path, blocking=False): pass
          deployment = Deployment(root)
          # Native HTTP middleware must share this lease with other writers.
          with deployment.lock('writers', shared=True):
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as workers:
                  futures = [workers.submit(health_probe,deployment,deployment.current_build()) for _ in range(8)]
                  for future in futures: future.result(timeout=30)
          print('Native Windows shared/exclusive exclusion and concurrent HTTP/MCP probes passed')
          PYCODE
      - name: Verify packaged Workbench WebSocket entry
        run: |
          python - <<'PYCODE'
          import asyncio
          from websockets.asyncio.client import connect
          from websockets.exceptions import ConnectionClosedError
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as probe:
              probe.connect(('8.8.8.8', 80))
              lan = probe.getsockname()[0]
          async def verify():
              try:
                  async with connect(f'ws://{lan}:50104/ws', origin=f'http://{lan}:60104', proxy=None) as ws:
                      await ws.recv()
              except ConnectionClosedError as exc:
                  assert exc.rcvd.code == 1008 and exc.rcvd.reason == '请先登录', str(exc)
              else:
                  raise AssertionError('Unauthenticated WebSocket must be rejected')
          asyncio.run(verify())
          PYCODE
      - name: Verify native stop and restart
        run: |
          python - <<'PYCODE'
          import json, os, pathlib, subprocess, time, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-install'/'nexus'
          helper = root/'launcher'/('mino-maintain.exe' if os.name == 'nt' else 'mino-maintain')
          entry = pathlib.Path(os.environ['RUNNER_TEMP'])/'mino-commands'/('mino-nexus'+('.cmd' if os.name=='nt' else ''))
          command = ['cmd', '/c', str(entry)] if os.name=='nt' else [str(entry)]
          for action in ('stop','stop','start','start'):
              subprocess.run(command + [action], check=True)
              status = json.loads(subprocess.check_output(command + ['status'], text=True))
              assert status['running'] == (action == 'start'), status
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(60):
              try:
                  with opener.open('http://127.0.0.1:50104/sys/server_info', timeout=2) as response: result = json.load(response)
                  assert result.get('data',result)['build_id'] == json.loads(pathlib.Path('dist/manifest.json').read_text())['build_id']
                  break
              except OSError:
                  if attempt == 59: raise
                  time.sleep(1)
          if os.name == 'nt':
              # Inspect the real packaged service after the start command exits.
              import ctypes
              query = 'Get-CimInstance Win32_Process | Select-Object ProcessId,ExecutablePath | ConvertTo-Json -Compress'
              processes = json.loads(subprocess.check_output(['powershell', '-NoProfile', '-Command', query], text=True, creationflags=subprocess.CREATE_NO_WINDOW))
              owned = [p for p in processes if p.get('ExecutablePath') and pathlib.Path(p['ExecutablePath']).is_relative_to(root)]
              assert len(owned) >= 2, owned
              kernel = ctypes.WinDLL('kernel32', use_last_error=True)
              user = ctypes.WinDLL('user32', use_last_error=True)
              kernel.GetConsoleWindow.restype = ctypes.c_void_p
              user.IsWindowVisible.argtypes = [ctypes.c_void_p]
              kernel.FreeConsole()
              for process in owned:
                  attached = kernel.AttachConsole(process['ProcessId'])
                  if attached:
                      window = kernel.GetConsoleWindow()
                      visible = bool(window and user.IsWindowVisible(window))
                      kernel.FreeConsole()
                      assert not visible, f"Service has a visible console: {process}"
                  else:
                      assert ctypes.get_last_error() == 6, (process, ctypes.get_last_error())
              print('Windows background service processes have no visible console:', len(owned))
          subprocess.run(command + ['stop'], check=True)
          PYCODE
      - uses: actions/upload-artifact@v5
        with:
          name: native-package-${{ matrix.platform }}
          path: |
            dist/Mino*.zip
            dist/item-*.json
            dist/MinoInstaller-*
            dist/installer-*.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          pattern: native-package-*
          merge-multiple: true
          path: dist
      - name: Validate packages and create manifest
        env:
          RELEASE_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: python scripts/write_manifest.py --dist dist --prefix "$RELEASE_PREFIX"
      - name: Require every native platform and assemble installer checksums
        run: |
          python - <<'PYCODE'
          import json, pathlib, shutil
          root = pathlib.Path('dist')
          expected = {('linux','x64'), ('win32','x64'), ('darwin','arm64'), ('darwin','x64')}
          items = json.loads((root/'manifest.json').read_text())['items']
          assert {(x['os'],x['arch']) for x in items} == expected
          hashes = sorted(root.glob('installer-*.sha256'))
          assert len(hashes) == 4
          (root/'INSTALLER-SHA256SUMS.txt').write_text(''.join(p.read_text() for p in hashes))
          for name in ('install.sh','install.ps1','bootstrap.sh','bootstrap.ps1'):
              shutil.copyfile(pathlib.Path('packaging')/name, root/name)
          PYCODE
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Mino*.zip
            dist/manifest.json
            dist/bootstrap.sh
            dist/bootstrap.ps1
            dist/install.sh
            dist/install.ps1
            dist/MinoInstaller-*
            dist/INSTALLER-SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
