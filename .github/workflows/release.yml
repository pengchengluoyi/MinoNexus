name: Release native baseline
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller
      - name: Validate source version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; assert os.environ['GITHUB_REF_NAME'] == 'v' + __import__('pathlib').Path('mino_nexus/VERSION').read_text().strip()"
      - name: Validate repository installer
        run: |
          bash -n packaging/bootstrap.sh
          bash packaging/bootstrap.sh --help
      - run: python scripts/build_release.py --output dist
      - name: Create install manifest for the exact build
        run: |
          VERSION=$(python -c "from pathlib import Path; import json; print(Path('mino_nexus/VERSION').read_text().strip() if Path('mino_nexus').is_dir() else json.loads(Path('package.json').read_text())['version'])")
          python scripts/write_manifest.py --dist dist --prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION"
      - name: Validate installer against the actual native package
        run: bash packaging/bootstrap.sh --environment test --package-dir "$PWD/dist" --root "$RUNNER_TEMP/mino-install/nexus"
      - name: Verify packaged Workbench WebSocket entry
        run: |
          python - <<'PYCODE'
          import asyncio
          from websockets.asyncio.client import connect
          from websockets.exceptions import ConnectionClosedError
          async def verify():
              try:
                  async with connect('ws://127.0.0.1:50101/ws', origin='http://127.0.0.1:60101') as ws:
                      await ws.recv()
              except ConnectionClosedError as exc:
                  assert exc.rcvd.code == 1008 and exc.rcvd.reason == '请先登录', str(exc)
              else:
                  raise AssertionError('Unauthenticated WebSocket must be rejected')
          asyncio.run(verify())
          PYCODE
      - run: cp packaging/bootstrap.sh dist/bootstrap.sh
      - uses: actions/upload-artifact@v5
        with:
          name: native-package
          path: |
            dist/Mino*.zip
            dist/item-*.json
            dist/manifest.json
            dist/bootstrap.sh
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: native-package
          path: dist
      - name: Validate packages and create manifest
        env:
          RELEASE_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: python scripts/write_manifest.py --dist dist --prefix "$RELEASE_PREFIX"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Mino*.zip
            dist/manifest.json
            dist/bootstrap.sh
          fail_on_unmatched_files: true
          generate_release_notes: true
